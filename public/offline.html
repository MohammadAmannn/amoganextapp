<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Connection – Ooops!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
      animation: fadeIn .35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    #wifi-icon  { animation: bob 2.4s ease-in-out infinite; margin-bottom: 20px; }
    #clouds     { animation: bob 3s ease-in-out infinite; animation-delay: 0.4s; margin-top: 32px; }
    h1 { font-size: 36px; font-weight: 700; color: #2d2d2d; margin-bottom: 10px; letter-spacing: -0.5px; }
    p  { font-size: 15px; color: #888; text-align: center; line-height: 1.7; max-width: 240px; }
  </style>
</head>
<body>

  <!-- Wi-Fi off icon -->
  <div id="wifi-icon">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="No wifi">
      <path d="M10 27C18.5 18.5 30.5 13 44 13" stroke="#5BB8F5" stroke-width="4.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M17 34C23.5 27.5 32.5 23 43 23" stroke="#5BB8F5" stroke-width="4.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M24.5 41.5C28.5 37.5 33.5 35 39.5 35" stroke="#5BB8F5" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="36" cy="52" r="4" fill="#5BB8F5"/>
      <line x1="8" y1="64" x2="62" y2="10" stroke="#5BB8F5" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>

  <h1>Ooops!</h1>
  <p>Internet connection not found<br>Check the connection</p>

  <!-- Cloud characters -->
  <div id="clouds">
    <svg width="280" height="160" viewBox="0 0 280 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M20 148 Q140 155 260 148" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>
      <!-- LEFT CLOUD -->
      <ellipse cx="88" cy="72" rx="42" ry="30" fill="#e8e8e8"/>
      <circle cx="65" cy="78" r="20" fill="#e8e8e8"/>
      <circle cx="111" cy="78" r="20" fill="#e8e8e8"/>
      <path d="M54 68 Q88 44 122 68" fill="#b0b0b0"/>
      <rect x="52" y="66" width="72" height="10" rx="5" fill="#9a9a9a"/>
      <circle cx="78" cy="79" r="3.5" fill="#555"/>
      <circle cx="98" cy="79" r="3.5" fill="#555"/>
      <path d="M78 91 Q88 86 98 91" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/>
      <line x1="68" y1="100" x2="52" y2="120" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
      <line x1="108" y1="100" x2="118" y2="118" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="74" cy="136" rx="10" ry="5" fill="#c8c8c8"/>
      <ellipse cx="100" cy="136" rx="10" ry="5" fill="#c8c8c8"/>
      <circle cx="69" cy="141" r="3" fill="#aaa"/>
      <circle cx="79" cy="141" r="3" fill="#aaa"/>
      <circle cx="95" cy="141" r="3" fill="#aaa"/>
      <circle cx="105" cy="141" r="3" fill="#aaa"/>
      <rect x="38" y="118" width="18" height="12" rx="3" fill="#c8c8c8" stroke="#aaa" stroke-width="1.5"/>
      <line x1="43" y1="118" x2="43" y2="112" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
      <line x1="50" y1="118" x2="50" y2="112" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="58" font-size="18" fill="#ccc" font-family="Georgia, serif" font-weight="700">?</text>
      <text x="60" y="42" font-size="14" fill="#d0d0d0" font-family="Georgia, serif" font-weight="700">?</text>
      <!-- BULB -->
      <ellipse cx="142" cy="114" rx="10" ry="13" fill="#f5f5a0" stroke="#d4d400" stroke-width="1.5"/>
      <rect x="137" y="126" width="10" height="5" rx="2" fill="#ccc"/>
      <line x1="142" y1="101" x2="142" y2="96" stroke="#f0c040" stroke-width="2" stroke-linecap="round"/>
      <line x1="134" y1="104" x2="131" y2="100" stroke="#f0c040" stroke-width="2" stroke-linecap="round"/>
      <line x1="150" y1="104" x2="153" y2="100" stroke="#f0c040" stroke-width="2" stroke-linecap="round"/>
      <!-- RIGHT CLOUD -->
      <ellipse cx="200" cy="72" rx="42" ry="30" fill="#e8e8e8"/>
      <circle cx="177" cy="78" r="20" fill="#e8e8e8"/>
      <circle cx="223" cy="78" r="20" fill="#e8e8e8"/>
      <path d="M166 68 Q200 44 234 68" fill="#b0b0b0"/>
      <rect x="164" y="66" width="72" height="10" rx="5" fill="#9a9a9a"/>
      <circle cx="190" cy="79" r="3.5" fill="#555"/>
      <circle cx="210" cy="79" r="3.5" fill="#555"/>
      <path d="M190 91 Q200 86 210 91" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/>
      <line x1="180" y1="100" x2="162" y2="118" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
      <line x1="220" y1="100" x2="230" y2="118" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="186" cy="136" rx="10" ry="5" fill="#c8c8c8"/>
      <ellipse cx="212" cy="136" rx="10" ry="5" fill="#c8c8c8"/>
      <circle cx="181" cy="141" r="3" fill="#aaa"/>
      <circle cx="191" cy="141" r="3" fill="#aaa"/>
      <circle cx="207" cy="141" r="3" fill="#aaa"/>
      <circle cx="217" cy="141" r="3" fill="#aaa"/>
      <rect x="152" y="118" width="18" height="12" rx="3" fill="#c8c8c8" stroke="#aaa" stroke-width="1.5"/>
      <line x1="157" y1="130" x2="157" y2="136" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
      <line x1="164" y1="130" x2="164" y2="136" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

</body>
</html>
